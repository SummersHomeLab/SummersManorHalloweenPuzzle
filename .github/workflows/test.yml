name: Test Pipeline

on:
  push:
    branches:
      - master

jobs:
  DeployTest:
    if: github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      github_environment: TEST
      overlay_path: k8s/overlays/test
      namespace: halloween-web-app-test
      deploy_mode: build
      target_tag_prefix: test
      commit_sha: ${{ github.sha }}
      diff_base: ${{ github.event.before }}
    secrets: inherit
