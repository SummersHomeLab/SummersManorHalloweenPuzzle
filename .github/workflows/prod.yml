name: Prod Pipeline

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to deploy (optional, defaults to the latest successful test run on master)"
        required: false
        type: string

jobs:
  ResolveSha:
    name: Resolve commit to deploy
    runs-on: [self-hosted, Linux, docker, kubernetes]
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      - name: Resolve SHA
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            let sha = "${{ github.event.inputs.commit_sha }}".trim();
            if (!sha) {
              const { owner, repo } = context.repo;
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'test.yml',
                status: 'completed',
                conclusion: 'success',
                branch: 'master',
                per_page: 1
              });
              if (!runs.data.workflow_runs.length) {
                core.setFailed('No successful Test Pipeline run found on master.');
                return;
              }
              sha = runs.data.workflow_runs[0].head_sha;
              console.log(`Resolved latest successful Test Pipeline run SHA: ${sha}`);
            } else {
              console.log(`Using user-supplied SHA: ${sha}`);
            }
            core.setOutput('commit_sha', sha);

  DeployProd:
    name: Promote (if needed) & Deploy Prod
    needs: ResolveSha
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      github_environment: PROD
      overlay_path: k8s/overlays/prod
      namespace: halloween-web-app
      deploy_mode: promote
      source_tag_prefix: test
      target_tag_prefix: prod
      commit_sha: ${{ needs.ResolveSha.outputs.commit_sha }}
    secrets: inherit
