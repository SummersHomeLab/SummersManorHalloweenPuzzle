name: Main Pipeline

on:
  push:
    branches:
      - master

env:
  BUILD_NUMBER: 1.0.${{ github.run_number }}

jobs:
  BuildAndDeployTest:
    name: Build & Deploy to Test
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '***NO_CI***')
    runs-on: [self-hosted, Linux, docker, kubernetes]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect change scope
        id: change_scope
        run: |
          CHANGED_FILES="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)"
          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES="$(git show --pretty="" --name-only "${{ github.sha }}")"
          fi
          if echo "$CHANGED_FILES" | grep -qvE '^(k8s/|$)'; then
            echo "non_k8s_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "non_k8s_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Kustomize
        run: |
          mkdir -p ~/.local/bin
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          mv kustomize ~/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Prune all Docker images
        if: steps.change_scope.outputs.non_k8s_changed == 'true'
        run: |
          docker image prune -a -f

      - name: Build Docker image
        if: steps.change_scope.outputs.non_k8s_changed == 'true'
        run: |
          docker build --no-cache \
            -t summershalloween/summershalloween:${{ env.BUILD_NUMBER }} \
            -f SummersManorHalloweenPuzzle/Dockerfile.webapp \
            SummersManorHalloweenPuzzle

      - name: Tag image for Nexus Test
        if: steps.change_scope.outputs.non_k8s_changed == 'true'
        run: |
          docker tag summershalloween/summershalloween:${{ env.BUILD_NUMBER }} nexus.summershome.duckdns.org/summershalloween/summershalloween:test.${{ env.BUILD_NUMBER }}

      - name: Login to Nexus
        if: steps.change_scope.outputs.non_k8s_changed == 'true'
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login nexus.summershome.duckdns.org -u "${{ secrets.NEXUS_USERNAME }}" --password-stdin

      - name: Push image to Nexus Test
        if: steps.change_scope.outputs.non_k8s_changed == 'true'
        run: |
          docker push nexus.summershome.duckdns.org/summershalloween/summershalloween:test.${{ env.BUILD_NUMBER }}

      - name: Update kustomize image tag (test)
        if: steps.change_scope.outputs.non_k8s_changed == 'true'
        working-directory: k8s/overlays/test
        run: |
          kustomize edit set image nexus.summershome.duckdns.org/summershalloween/summershalloween:test.${{ env.BUILD_NUMBER }}

      - name: Deploy to test cluster
        run: |
          kubectl apply -k k8s/overlays/test

      - name: Commit updated image tag (test)
        if: steps.change_scope.outputs.non_k8s_changed == 'true'
        run: |
          git config user.email "pipeline@devops"
          git config user.name "GitHub Action"
          git fetch origin master
          git checkout master
          git add k8s/overlays/test/kustomization.yaml
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "Update test image tag to ${{ env.BUILD_NUMBER }} ***NO_CI***"
          git rebase origin/master
          git push origin HEAD:master

  DeployToProd:
    name: Deploy To Prod
    needs: BuildAndDeployTest
    runs-on: [self-hosted, Linux, docker, kubernetes]
    permissions:
      contents: write
    environment: PROD
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect change scope
        id: change_scope
        run: |
          CHANGED_FILES="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)"
          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES="$(git show --pretty="" --name-only "${{ github.sha }}")"
          fi
          if echo "$CHANGED_FILES" | grep -qvE '^(k8s/|$)'; then
            echo "non_k8s_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "non_k8s_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Kustomize
        run: |
          mkdir -p ~/.local/bin
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          mv kustomize ~/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Login to Nexus
        if: steps.change_scope.outputs.non_k8s_changed == 'true'
        run: |
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login nexus.summershome.duckdns.org -u "${{ secrets.NEXUS_USERNAME }}" --password-stdin

      - name: Pull test image from Nexus
        if: steps.change_scope.outputs.non_k8s_changed == 'true'
        run: |
          docker pull nexus.summershome.duckdns.org/summershalloween/summershalloween:test.${{ env.BUILD_NUMBER }}

      - name: Tag image for Nexus Prod
        if: steps.change_scope.outputs.non_k8s_changed == 'true'
        run: |
          docker tag nexus.summershome.duckdns.org/summershalloween/summershalloween:test.${{ env.BUILD_NUMBER }} nexus.summershome.duckdns.org/summershalloween/summershalloween:prod.${{ env.BUILD_NUMBER }}

      - name: Push image to Nexus Prod
        if: steps.change_scope.outputs.non_k8s_changed == 'true'
        run: |
          docker push nexus.summershome.duckdns.org/summershalloween/summershalloween:prod.${{ env.BUILD_NUMBER }}

      - name: Update kustomize image tag (prod)
        if: steps.change_scope.outputs.non_k8s_changed == 'true'
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image nexus.summershome.duckdns.org/summershalloween/summershalloween:prod.${{ env.BUILD_NUMBER }}

      - name: Deploy to prod cluster
        run: |
          kubectl apply -k k8s/overlays/prod

      - name: Commit updated image tag (prod)
        if: steps.change_scope.outputs.non_k8s_changed == 'true'
        run: |
          git config user.email "pipeline@devops"
          git config user.name "GitHub Action"
          git fetch origin master
          git checkout master
          git add k8s/overlays/prod/kustomization.yaml
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "Update prod image tag to ${{ env.BUILD_NUMBER }} ***NO_CI***"
          git rebase origin/master
          git push origin HEAD:master
